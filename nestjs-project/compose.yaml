services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
      # node_modules lives in a named volume, NOT in the bind mount. Reading it
      # through the Windows bind mount costs ~12s just to require @nestjs/core
      # (vs ~230ms from the container filesystem), which made every Jest run
      # take ~25s per file regardless of the transform.
      # Trade-off: node_modules is not visible on the host, so every npm/npx
      # command must run inside the container (already the project rule).
      - nestjs_node_modules:/home/node/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    volumes:
      # Without this, postgres:17 falls back to an ANONYMOUS volume: the data
      # survives `stop`/`start` but a single `docker compose down` orphans it and
      # the dev database is gone. A named volume survives `down` and
      # `system prune -a`; only `down -v` / `prune --volumes` remove it, and both
      # are explicitly destructive.
      - streamtube_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  nestjs_node_modules:
  streamtube_pgdata:


